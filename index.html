    <div id="root"></div>
    <!-- Falcon 9 launch button (injected) -->
    <style>
      .f9-btn{position:relative;display:inline-flex;align-items:center;gap:.65rem;overflow:hidden;
        font-family:'IBM Plex Mono',ui-monospace,monospace!important;letter-spacing:.16em;text-transform:uppercase;
        border:1px solid rgba(240,151,59,.55)!important;color:#F7F6F3!important;background:rgba(240,151,59,.06)!important;
        transition:border-color .25s,background .25s,box-shadow .25s!important}
      .f9-btn:hover{border-color:#F0973B!important;background:rgba(240,151,59,.14)!important;box-shadow:0 0 24px rgba(240,151,59,.25)}
      .f9-dot{width:8px;height:8px;border-radius:50%;background:#F0973B;flex:none;animation:f9pulse 1.4s infinite}
      @keyframes f9pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .f9-rkt{flex:none;overflow:visible;margin:-4px 0}
      .f9-rkt .fl{opacity:0}
      .f9-btn:hover .f9-rkt{animation:f9launch 2.6s forwards}
      .f9-btn:hover .f9-rkt .fl{animation:f9burn .5s .15s forwards}
      .f9-btn:hover .f9-rkt .fl-in{animation:f9flick .08s linear infinite alternate}
      @keyframes f9launch{
        0%{transform:translate(0,0)}
        8%{transform:translate(-.5px,0)}12%{transform:translate(.5px,0)}16%{transform:translate(-.5px,0)}20%{transform:translate(.5px,0)}
        26%{transform:translate(0,0);animation-timing-function:cubic-bezier(.6,0,.9,.55)}
        100%{transform:translate(0,-64px)}}
      @keyframes f9burn{0%{opacity:0}100%{opacity:1}}
      @keyframes f9flick{to{transform:scaleY(1.25)}}
      .f9-rkt .fl-in{transform-box:fill-box;transform-origin:50% 0}
      .f9-flame{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#F0973B,transparent);
        transform:scaleX(0);transition:transform .35s;transform-origin:center}
      .f9-btn:hover .f9-flame{transform:scaleX(1)}
      .f9-hint{display:inline-flex;align-items:center;gap:.45rem;align-self:center;
        font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
        color:#B9B5AC;opacity:0;transform:translateX(-6px);transition:opacity .7s ease,transform .7s ease;pointer-events:none}
      .f9-hint.on{opacity:1;transform:translateX(0)}
      .f9-hint .f9-arrow{display:inline-block;color:#F0973B;animation:f9nudge 1.6s ease-in-out infinite}
      @keyframes f9nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .rb-btn{position:relative;display:inline-flex;align-items:center;gap:.65rem;overflow:hidden;
        font-family:'IBM Plex Mono',ui-monospace,monospace!important;letter-spacing:.16em;text-transform:uppercase;
        border:1px solid #F7F6F3!important;color:#111110!important;background:#F7F6F3!important;
        background-image:linear-gradient(rgba(17,17,16,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,16,.06) 1px,transparent 1px)!important;
        background-size:10px 10px!important;
        transition:border-color .25s,box-shadow .25s,transform .25s!important}
      .rb-btn:hover{border-color:#F0973B!important;box-shadow:0 0 0 1px #F0973B,0 0 24px rgba(240,151,59,.3)}
      .rb-bot{flex:none;overflow:visible}
      .rb-bot .eye{fill:#F0973B;animation:rbblink 3.2s infinite}
      .rb-bot .jt{fill:#F7F6F3;stroke:#111110;stroke-width:1.6;transition:fill .2s}
      .rb-btn:hover .rb-bot .jt{fill:#F0973B}
      .rb-btn:hover .rb-bot .jt:nth-of-type(2){transition-delay:.06s}.rb-btn:hover .rb-bot .jt:nth-of-type(3){transition-delay:.12s}.rb-btn:hover .rb-bot .jt:nth-of-type(4){transition-delay:.18s}
      .rb-scan{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(90deg,transparent,rgba(240,151,59,.18),transparent);transform:translateX(-100%);pointer-events:none}
      .rb-btn:hover .rb-scan{animation:rbscan .9s ease-out}
      .rb-bot .arm,.rb-bot .head{transform-box:fill-box;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
      .rb-bot .al{transform-origin:100% 0}.rb-bot .ar{transform-origin:0 0}.rb-bot .head{transform-origin:50% 100%}
      .rb-btn:hover .rb-bot .al{transform:rotate(80deg)}
      .rb-btn:hover .rb-bot .ar{transform:rotate(-80deg)}
      .rb-btn:hover .rb-bot .head{transform:translateY(-1.5px)}
      .rb-bot .visor{fill:#F0973B;opacity:0;transition:opacity .2s .15s}
      .rb-btn:hover .rb-bot .visor{opacity:1;animation:rbvisor .9s ease-in-out .3s infinite alternate}
      .rb-btn:hover .rb-bot .eye{opacity:0;animation:none}
      @keyframes rbvisor{from{opacity:1}to{opacity:.45}}
      .rb-c{position:absolute;width:9px;height:9px;border:0 solid #F0973B;opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .2s}
      .rb-c.tl{top:4px;left:4px;border-top-width:2px;border-left-width:2px;transform:translate(-8px,-8px)}
      .rb-c.tr{top:4px;right:4px;border-top-width:2px;border-right-width:2px;transform:translate(8px,-8px);transition-delay:.05s}
      .rb-c.bl{bottom:4px;left:4px;border-bottom-width:2px;border-left-width:2px;transform:translate(-8px,8px);transition-delay:.1s}
      .rb-c.br{bottom:4px;right:4px;border-bottom-width:2px;border-right-width:2px;transform:translate(8px,8px);transition-delay:.15s}
      .rb-btn:hover .rb-c{opacity:1;transform:none}
      @keyframes rbblink{0%,92%,100%{opacity:1}95%{opacity:.15}}
      @keyframes rbscan{to{transform:translateX(100%)}}
      @media (prefers-reduced-motion:reduce){.rb-bot .eye,.rb-btn:hover .rb-scan,.rb-btn:hover .rb-bot .visor{animation:none}.rb-bot .jt,.rb-bot .arm,.rb-bot .head,.rb-c{transition:none}}
      @media (prefers-reduced-motion:reduce){.f9-dot{animation:none}.f9-btn:hover .f9-rkt,.f9-btn:hover .f9-rkt .fl,.f9-btn:hover .f9-rkt .fl-in{animation:none}.f9-flame{transition:none}.f9-hint{transition:none}.f9-hint .f9-arrow{animation:none}}
      /* View My Numbers: line chart draws bottom-left to top-right while hovered */
      .vn-btn{position:relative;overflow:hidden;isolation:isolate}
      .vn-chart{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
      .vn-chart .ln{fill:none;stroke:#F0973B;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .25s ease}
      .vn-chart .ar{opacity:0;transition:opacity .2s}
      .vn-chart .pt{fill:#F0973B;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:opacity .15s,transform .15s}
      .vn-btn:hover .vn-chart .ln,.vn-btn:focus-visible .vn-chart .ln{stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.45,0,.2,1)}
      .vn-btn:hover .vn-chart .ar,.vn-btn:focus-visible .vn-chart .ar{opacity:1;transition:opacity .6s .6s}
      .vn-btn:hover .vn-chart .pt,.vn-btn:focus-visible .vn-chart .pt{opacity:1;transform:scale(1);transition:opacity .2s 1.05s,transform .35s cubic-bezier(.3,1.8,.5,1) 1.05s}
      @media (prefers-reduced-motion:reduce){.vn-chart .ln,.vn-chart .ar,.vn-chart .pt{transition:none!important}}
      /* résumé link retired: hidden, not removed, so React's tree stays intact */
      #top a[href$="Antonio-Planzo-Resume.pdf"]{display:none!important}
      /* 155 mm rollout kit button: press-room slab with a broadcast mark */
      .rk-btn{position:relative;display:inline-flex;align-items:center;gap:.7rem;overflow:hidden;
        font-family:'IBM Plex Mono',ui-monospace,monospace!important;letter-spacing:.16em;text-transform:uppercase;
        border:1px solid rgba(247,246,243,.42)!important;color:#F7F6F3!important;background-color:#1C1C1A!important;
        background-image:radial-gradient(rgba(247,246,243,.09) 1px,transparent 1.2px)!important;background-size:6px 6px!important;
        transition:border-color .25s,box-shadow .25s,transform .25s!important}
      .rk-btn:hover{border-color:#F0973B!important;box-shadow:0 0 24px rgba(240,151,59,.22)}
      .rk-ico{flex:none;overflow:visible}
      .rk-ico .doc{stroke:#F7F6F3}
      .rk-ico .arc{stroke:#7A766E;transition:stroke .2s}
      .rk-btn:hover .rk-ico .arc{stroke:#F0973B;animation:rkwave 1.2s ease-in-out infinite}
      .rk-btn:hover .rk-ico .a2{animation-delay:.15s}.rk-btn:hover .rk-ico .a3{animation-delay:.3s}
      @keyframes rkwave{0%,100%{opacity:1}50%{opacity:.25}}
      .rk-ammo{position:absolute;left:0;right:0;bottom:6px;height:4px;pointer-events:none}
      .rk-rnd{position:absolute;top:0;left:-34px;width:9px;height:4px;background:#F0973B;border-radius:0 3px 3px 0;opacity:0}
      .rk-rnd::after{content:'';position:absolute;left:0;top:0;width:3px;height:4px;background:#C9C3B6}
      .rk-rnd::before{content:'';position:absolute;right:100%;top:1px;width:28px;height:2px;background:linear-gradient(90deg,transparent,rgba(240,151,59,.85))}
      .rk-btn:hover .rk-rnd{animation:rkfire .95s cubic-bezier(.2,.75,.4,1) infinite}
      .rk-btn:hover .rk-rnd:nth-child(2){animation-delay:.16s}.rk-btn:hover .rk-rnd:nth-child(3){animation-delay:.32s}
      @keyframes rkfire{0%{left:-34px;opacity:1}60%{left:calc(100% + 34px);opacity:1}61%,100%{left:calc(100% + 34px);opacity:0}}
      .rk-flash{position:absolute;left:-10px;bottom:-4px;width:26px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(251,227,188,.9),rgba(240,151,59,.5),transparent);opacity:0;pointer-events:none}
      .rk-btn:hover .rk-flash{animation:rkflash .32s steps(2) infinite}
      @keyframes rkflash{0%{opacity:.9}100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.rk-btn:hover .rk-ico .arc,.rk-btn:hover .rk-rnd,.rk-btn:hover .rk-flash{animation:none}}
    </style>
    <script>
      (function(){
        function inject(){
          var row = document.querySelector('#top .flex.flex-wrap.gap-4');
          if(!row || document.querySelector('.f9-btn')) return !!row;
          var a = document.createElement('a');
          a.href = './falcon9-crs20/';
          a.className = 'btn-outline focus-ring f9-btn';
          a.setAttribute('aria-label','Falcon 9 Launch: view the CRS-20 field notes page');
          a.innerHTML = '<span class="f9-dot"></span>Falcon 9 Launch'
            + '<svg class="f9-rkt" width="12" height="28" viewBox="0 0 12 28" aria-hidden="true">'
            + '<g class="fl"><g class="fl-in"><ellipse cx="6" cy="23.5" rx="2.6" ry="4" fill="#F0973B" opacity=".3"/><path d="M4.7 20.2 6 27.5 7.3 20.2Z" fill="#F0973B"/><path d="M5.3 20.2 6 24.5 6.7 20.2Z" fill="#FBE3BC"/></g></g>'
            + '<path d="M4.6 4.2 6 .6 7.4 4.2Z" fill="#E4E1DA"/>'
            + '<rect x="4.6" y="4.2" width="2.8" height="3.2" fill="#F4F2ED"/>'
            + '<rect x="4.4" y="7.4" width="3.2" height="2.6" fill="#EDEBE6"/>'
            + '<rect x="4.4" y="10" width="3.2" height="1.1" fill="#3A3A36"/>'
            + '<rect x="4.4" y="11.1" width="3.2" height="9.1" fill="#EDEBE6"/>'
            + '<rect x="3.2" y="11.6" width="1.2" height="1.5" fill="#55534E"/><rect x="7.6" y="11.6" width="1.2" height="1.5" fill="#55534E"/>'
            + '<rect x="3.7" y="16.8" width=".7" height="3.4" fill="#55534E"/><rect x="7.6" y="16.8" width=".7" height="3.4" fill="#55534E"/>'
            + '</svg>'
            + '<span class="f9-flame"></span>';
          row.appendChild(a);
          var hint = document.createElement('span');
          hint.className = 'f9-hint';
          hint.setAttribute('aria-hidden','true');
          hint.innerHTML = '<span class="f9-arrow">&#8593;</span>Interactive work samples';
          row.appendChild(hint);
          var rb = document.createElement('a');
          rb.href = './robotics-thesis/';
          rb.className = 'btn-outline focus-ring rb-btn';
          rb.setAttribute('aria-label','Robotics thesis: view the humanoid robotics research page');
          rb.innerHTML = '<svg class="rb-bot" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="head"><rect x="6" y="1.5" width="12" height="8" rx="3"/><circle class="eye" cx="10" cy="5.5" r="1.1" stroke="none"/><circle class="eye" cx="14" cy="5.5" r="1.1" stroke="none"/><rect class="visor" x="7.6" y="4.6" width="8.8" height="1.8" rx=".9" stroke="none"/></g><path d="M8 11.5h8l1 6H7z"/><path class="arm al" d="M7 12.5L4 17"/><path class="arm ar" d="M17 12.5l3 4.5"/><path d="M10 17.5v5M14 17.5v5"/><circle class="jt" cx="7" cy="12.5" r="1.3"/><circle class="jt" cx="17" cy="12.5" r="1.3"/><circle class="jt" cx="10" cy="20" r="1.3"/><circle class="jt" cx="14" cy="20" r="1.3"/></svg>'
            + 'Robotics Thesis<span class="rb-scan"></span><span class="rb-c tl"></span><span class="rb-c tr"></span><span class="rb-c bl"></span><span class="rb-c br"></span>';
          row.insertBefore(rb, a);
          var rk = document.createElement('a');
          rk.href = './artillery-kit/';
          rk.className = 'btn-outline focus-ring rk-btn';
          rk.setAttribute('aria-label','155 mm rollout kit: view the public affairs work sample');
          rk.innerHTML = '<svg class="rk-ico" width="20" height="18" viewBox="0 0 26 22" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
            + '<path class="doc" d="M2 3.5h9l3 3V20H2z"/><path class="doc" d="M5 10h6M5 13h6M5 16h4"/>'
            + '<path class="arc a1" d="M17 9.5a3 3 0 0 1 0 5"/><path class="arc a2" d="M19.5 7a6.5 6.5 0 0 1 0 10"/><path class="arc a3" d="M22 4.5a10 10 0 0 1 0 15"/></svg>'
            + '155 mm Rollout Kit<span class="rk-ammo"><span class="rk-rnd"></span><span class="rk-rnd"></span><span class="rk-rnd"></span><span class="rk-flash"></span></span>';
          var cv = row.querySelector('a[href$="Antonio-Planzo-Resume.pdf"]');
          row.insertBefore(rk, cv || rb);
          var vn = row.querySelector('a[href="#audience"]');
          if(vn && !vn.querySelector('.vn-chart')){
            vn.classList.add('vn-btn');
            var W = Math.max(120, Math.round(vn.offsetWidth)), H = Math.max(36, Math.round(vn.offsetHeight)), pad = 6;
            var ys = [.96,.74,.84,.58,.68,.44,.54,.3,.4,.16,.24,.05];
            var pts = ys.map(function(y,i){ return [(pad + (W-2*pad)*i/(ys.length-1)).toFixed(1), (pad + (H-2*pad)*y).toFixed(1)]; });
            var d = 'M' + pts.map(function(p){ return p.join(','); }).join(' L');
            var last = pts[pts.length-1];
            var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS,'svg');
            svg.setAttribute('class','vn-chart'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('preserveAspectRatio','none'); svg.setAttribute('aria-hidden','true');
            svg.innerHTML = '<defs><linearGradient id="vnFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0973B" stop-opacity=".22"/><stop offset="1" stop-color="#F0973B" stop-opacity="0"/></linearGradient></defs>'
              + '<path class="ar" fill="url(#vnFill)" d="'+d+' L'+last[0]+','+H+' L'+pts[0][0]+','+H+' Z"/>'
              + '<path class="ln" pathLength="1" d="'+d+'"/>'
              + '<circle class="pt" r="3" cx="'+last[0]+'" cy="'+last[1]+'"/>';
            vn.appendChild(svg);
          }
          var tries = 0;
          (function waitFade(){
            var op = parseFloat(getComputedStyle(row).opacity);
            if(op > 0.95){ setTimeout(function(){ hint.classList.add('on'); }, 500); return; }
            if(++tries < 400) setTimeout(waitFade, 150);
          })();
          a.addEventListener('click', function(){ hint.classList.remove('on'); });
          return true;
        }
        if(!inject()){
          var mo = new MutationObserver(function(){ if(inject()) mo.disconnect(); });
          mo.observe(document.getElementById('root'), {childList:true, subtree:true});
          setTimeout(function(){ inject(); mo.disconnect(); }, 8000);
        }
      })();
    </script>
