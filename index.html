  </head>
  <body>
    <div id="root"></div>
    <!-- Falcon 9 launch button (injected) -->
    <style>
      .f9-btn{position:relative;display:inline-flex;align-items:center;gap:.65rem;overflow:hidden;
        font-family:'IBM Plex Mono',ui-monospace,monospace!important;letter-spacing:.16em;text-transform:uppercase;
        border:1px solid rgba(240,151,59,.55)!important;color:#F7F6F3!important;background:rgba(240,151,59,.06)!important;
        transition:border-color .25s,background .25s,box-shadow .25s!important}
      .f9-btn:hover{border-color:#F0973B!important;background:rgba(240,151,59,.14)!important;box-shadow:0 0 24px rgba(240,151,59,.25)}
      .f9-dot{width:8px;height:8px;border-radius:50%;background:#F0973B;flex:none;animation:f9pulse 1.4s infinite}
      @keyframes f9pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .f9-rkt{flex:none;transition:transform .35s cubic-bezier(.3,.6,.3,1)}
      .f9-btn:hover .f9-rkt{transform:translateY(-3px)}
      .f9-flame{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#F0973B,transparent);
        transform:scaleX(0);transition:transform .35s;transform-origin:center}
      .f9-btn:hover .f9-flame{transform:scaleX(1)}
      .f9-hint{display:inline-flex;align-items:center;gap:.45rem;align-self:center;
        font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
        color:#B9B5AC;opacity:0;transform:translateX(-6px);transition:opacity .7s ease,transform .7s ease;pointer-events:none}
      .f9-hint.on{opacity:1;transform:translateX(0)}
      .f9-hint .f9-arrow{display:inline-block;color:#F0973B;animation:f9nudge 1.6s ease-in-out infinite}
      @keyframes f9nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .rb-btn{position:relative;display:inline-flex;align-items:center;gap:.65rem;overflow:hidden;
        font-family:'IBM Plex Mono',ui-monospace,monospace!important;letter-spacing:.16em;text-transform:uppercase;
        border:1px solid #F7F6F3!important;color:#111110!important;background:#F7F6F3!important;
        background-image:linear-gradient(rgba(17,17,16,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,16,.06) 1px,transparent 1px)!important;
        background-size:10px 10px!important;
        transition:border-color .25s,box-shadow .25s,transform .25s!important}
      .rb-btn:hover{border-color:#F0973B!important;box-shadow:0 0 0 1px #F0973B,0 0 24px rgba(240,151,59,.3)}
      .rb-bot{flex:none;overflow:visible}
      .rb-bot .eye{fill:#F0973B;animation:rbblink 3.2s infinite}
      .rb-bot .jt{fill:#F7F6F3;stroke:#111110;stroke-width:1.6;transition:fill .2s}
      .rb-btn:hover .rb-bot .jt{fill:#F0973B}
      .rb-btn:hover .rb-bot .jt:nth-of-type(2){transition-delay:.06s}.rb-btn:hover .rb-bot .jt:nth-of-type(3){transition-delay:.12s}.rb-btn:hover .rb-bot .jt:nth-of-type(4){transition-delay:.18s}
      .rb-scan{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(90deg,transparent,rgba(240,151,59,.18),transparent);transform:translateX(-100%);pointer-events:none}
      .rb-btn:hover .rb-scan{animation:rbscan .9s ease-out}
      @keyframes rbblink{0%,92%,100%{opacity:1}95%{opacity:.15}}
      @keyframes rbscan{to{transform:translateX(100%)}}
      @media (prefers-reduced-motion:reduce){.rb-bot .eye,.rb-btn:hover .rb-scan{animation:none}.rb-bot .jt{transition:none}}
      @media (prefers-reduced-motion:reduce){.f9-dot{animation:none}.f9-rkt,.f9-flame{transition:none}.f9-hint{transition:none}.f9-hint .f9-arrow{animation:none}}
      /* résumé link retired: hidden, not removed, so React's tree stays intact */
      #top a[href$="Antonio-Planzo-Resume.pdf"]{display:none!important}
      /* 155 mm rollout kit button: press-room slab with a broadcast mark */
      .rk-btn{position:relative;display:inline-flex;align-items:center;gap:.7rem;overflow:hidden;
        font-family:'IBM Plex Mono',ui-monospace,monospace!important;letter-spacing:.16em;text-transform:uppercase;
        border:1px solid rgba(247,246,243,.42)!important;color:#F7F6F3!important;background-color:#1C1C1A!important;
        background-image:radial-gradient(rgba(247,246,243,.09) 1px,transparent 1.2px)!important;background-size:6px 6px!important;
        transition:border-color .25s,box-shadow .25s,transform .25s!important}
      .rk-btn:hover{border-color:#F0973B!important;box-shadow:0 0 24px rgba(240,151,59,.22)}
      .rk-ico{flex:none;overflow:visible}
      .rk-ico .doc{stroke:#F7F6F3}
      .rk-ico .arc{stroke:#7A766E;transition:stroke .2s}
      .rk-btn:hover .rk-ico .arc{stroke:#F0973B;animation:rkwave 1.2s ease-in-out infinite}
      .rk-btn:hover .rk-ico .a2{animation-delay:.15s}.rk-btn:hover .rk-ico .a3{animation-delay:.3s}
      @keyframes rkwave{0%,100%{opacity:1}50%{opacity:.25}}
      .rk-mark{position:absolute;left:1.2rem;right:1.2rem;bottom:.55rem;height:1px;background:#F0973B;transform:scaleX(0);transform-origin:0 50%;transition:transform .45s cubic-bezier(.3,.6,.3,1);pointer-events:none}
      .rk-btn:hover .rk-mark{transform:scaleX(1)}
      @media (prefers-reduced-motion:reduce){.rk-btn:hover .rk-ico .arc{animation:none}.rk-mark{transition:none}}
    </style>
    <script>
      (function(){
        function inject(){
          var row = document.querySelector('#top .flex.flex-wrap.gap-4');
          if(!row || document.querySelector('.f9-btn')) return !!row;
          var a = document.createElement('a');
          a.href = './falcon9-crs20/';
          a.className = 'btn-outline focus-ring f9-btn';
          a.setAttribute('aria-label','Falcon 9 Launch: view the CRS-20 field notes page');
          a.innerHTML = '<span class="f9-dot"></span>Falcon 9 Launch'
            + '<svg class="f9-rkt" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F0973B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>'
            + '<span class="f9-flame"></span>';
          row.appendChild(a);
          var hint = document.createElement('span');
          hint.className = 'f9-hint';
          hint.setAttribute('aria-hidden','true');
          hint.innerHTML = '<span class="f9-arrow">&#8593;</span>Interactive work samples';
          row.appendChild(hint);
          var rb = document.createElement('a');
          rb.href = './robotics-thesis/';
          rb.className = 'btn-outline focus-ring rb-btn';
          rb.setAttribute('aria-label','Robotics thesis: view the humanoid robotics research page');
          rb.innerHTML = '<svg class="rb-bot" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="1.5" width="12" height="8" rx="3"/><circle class="eye" cx="10" cy="5.5" r="1.1" stroke="none"/><circle class="eye" cx="14" cy="5.5" r="1.1" stroke="none"/><path d="M8 11.5h8l1 6H7z"/><path d="M7 12.5L4 17M17 12.5l3 4.5M10 17.5v5M14 17.5v5"/><circle class="jt" cx="7" cy="12.5" r="1.3"/><circle class="jt" cx="17" cy="12.5" r="1.3"/><circle class="jt" cx="10" cy="20" r="1.3"/><circle class="jt" cx="14" cy="20" r="1.3"/></svg>'
            + 'Robotics Thesis<span class="rb-scan"></span>';
          row.insertBefore(rb, a);
          var rk = document.createElement('a');
          rk.href = './artillery-kit/';
          rk.className = 'btn-outline focus-ring rk-btn';
          rk.setAttribute('aria-label','155 mm rollout kit: view the public affairs work sample');
          rk.innerHTML = '<svg class="rk-ico" width="20" height="18" viewBox="0 0 26 22" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
            + '<path class="doc" d="M2 3.5h9l3 3V20H2z"/><path class="doc" d="M5 10h6M5 13h6M5 16h4"/>'
            + '<path class="arc a1" d="M17 9.5a3 3 0 0 1 0 5"/><path class="arc a2" d="M19.5 7a6.5 6.5 0 0 1 0 10"/><path class="arc a3" d="M22 4.5a10 10 0 0 1 0 15"/></svg>'
            + '155 mm Rollout Kit<span class="rk-mark"></span>';
          var cv = row.querySelector('a[href$="Antonio-Planzo-Resume.pdf"]');
          row.insertBefore(rk, cv || rb);
          var tries = 0;
          (function waitFade(){
            var op = parseFloat(getComputedStyle(row).opacity);
            if(op > 0.95){ setTimeout(function(){ hint.classList.add('on'); }, 500); return; }
            if(++tries < 400) setTimeout(waitFade, 150);
          })();
          a.addEventListener('click', function(){ hint.classList.remove('on'); });
          return true;
        }
        if(!inject()){
          var mo = new MutationObserver(function(){ if(inject()) mo.disconnect(); });
          mo.observe(document.getElementById('root'), {childList:true, subtree:true});
          setTimeout(function(){ inject(); mo.disconnect(); }, 8000);
        }
      })();
    </script>
  </body>
</html>
